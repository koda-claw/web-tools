<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-tools console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="kicker">web-tools</p>
          <h1>Local Console</h1>
        </div>
        <div class="status-strip" id="summary"></div>
      </header>

      <section class="grid">
        <article class="panel span-2">
          <div class="panel-head">
            <h2>Setup Status</h2>
            <button class="icon-button" id="refresh" type="button" title="Refresh status">Refresh</button>
          </div>
          <div class="status-grid" id="checks"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Provider</h2>
            <span class="pill" id="provider-pill">pending</span>
          </div>
          <form id="provider-form" class="form-stack">
            <label>
              Provider
              <select name="provider">
                <option value="bigmodel">BigModel</option>
              </select>
            </label>
            <label>
              Auth env
              <input name="auth_env" value="ZHIPU_APIKEY" autocomplete="off" />
            </label>
            <label class="checkline">
              <input type="checkbox" name="enable_search_auto" />
              <span>Search auto</span>
            </label>
            <label class="checkline">
              <input type="checkbox" name="enable_reader_auto" />
              <span>Reader fallback</span>
            </label>
            <button type="submit">Save Provider</button>
          </form>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Env File</h2>
            <span class="pill" id="env-pill">pending</span>
          </div>
          <form id="env-form" class="form-stack">
            <label>
              Key
              <input name="key" value="ZHIPU_APIKEY" autocomplete="off" />
            </label>
            <label>
              Value
              <input name="value" type="password" autocomplete="new-password" />
            </label>
            <label class="checkline">
              <input type="checkbox" name="force" />
              <span>Overwrite</span>
            </label>
            <button type="submit">Save Env</button>
          </form>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Search Test</h2>
            <span class="pill">JSON</span>
          </div>
          <form id="search-form" class="form-stack">
            <label>
              Query
              <input name="query" value="Go readability library" />
            </label>
            <label>
              Provider
              <select name="provider">
                <option value="auto">auto</option>
                <option value="duckduckgo">duckduckgo</option>
                <option value="searxng">searxng</option>
                <option value="bigmodel">bigmodel</option>
              </select>
            </label>
            <button type="submit">Run Search</button>
          </form>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Reader Test</h2>
            <span class="pill">builtin</span>
          </div>
          <form id="reader-form" class="form-stack">
            <label>
              URL
              <input name="url" value="https://example.com" />
            </label>
            <label>
              Provider
              <select name="provider">
                <option value="builtin-reader">builtin-reader</option>
              </select>
            </label>
            <button type="submit">Run Reader</button>
          </form>
        </article>

        <article class="panel span-2">
          <div class="panel-head">
            <h2>Agent Guide</h2>
            <button id="copy-guide" type="button">Copy</button>
          </div>
          <pre id="agent-guide" class="codebox"></pre>
        </article>

        <article class="panel span-2">
          <div class="panel-head">
            <h2>Diagnostics</h2>
            <button id="download-diagnostics" type="button">Export JSON</button>
          </div>
          <pre id="output" class="codebox"></pre>
        </article>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
